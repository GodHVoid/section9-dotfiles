# ============================================================
# SECTION 9 // CYBERBRAIN AUTHORIZATION
# ============================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1800
}

# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =
    path = $HOME/.config/wallpapers/lockscreen/wallpaper

    color = rgba(2, 8, 14, 1.0)

    blur_passes = 2
    blur_size = 4

    noise = 0.015
    contrast = 0.82
    brightness = 0.24
    vibrancy = 0.08
    vibrancy_darkness = 0.7
}

# ============================================================
# TIME
# ============================================================

label {
    monitor =
    text = $TIME

    color = rgba(91, 218, 235, 1.0)

    font_size = 62
    font_family = monospace

    position = 0, 245
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%Y-%m-%d // %A'

    color = rgba(170, 195, 204, 0.82)

    font_size = 14
    font_family = monospace

    position = 0, 195
    halign = center
    valign = center
}

# ============================================================
# SECTION 9 IDENTIFICATION
# ============================================================

label {
    monitor =
    text = SECTION 9 // CYBERBRAIN AUTHORIZATION

    color = rgba(91, 218, 235, 1.0)

    font_size = 20
    font_family = monospace

    position = 0, 115
    halign = center
    valign = center
}

label {
    monitor =
    text = USER: $USER

    color = rgba(215, 232, 238, 0.94)

    font_size = 15
    font_family = monospace

    position = 0, 72
    halign = center
    valign = center
}

label {
    monitor =
    text = IDENTITY VERIFICATION REQUIRED

    color = rgba(135, 166, 176, 0.85)

    font_size = 11
    font_family = monospace

    position = 0, 43
    halign = center
    valign = center
}

# ============================================================
# PASSWORD INPUT
# ============================================================

input-field {
    monitor =

    size = 420, 54
    outline_thickness = 2

    outer_color = rgba(91, 218, 235, 0.72)
    inner_color = rgba(3, 14, 21, 0.90)
    font_color = rgba(218, 238, 242, 1.0)

    check_color = rgba(80, 230, 170, 1.0)
    fail_color = rgba(255, 91, 105, 1.0)

    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = 0

    fade_on_empty = false
    hide_input = false

    placeholder_text = CYBERBRAIN PASSPHRASE
    fail_text = AUTHORIZATION DENIED // $FAIL // ATTEMPT $ATTEMPTS

    rounding = 2

    capslock_color = rgba(242, 184, 75, 1.0)
    numlock_color = rgba(242, 184, 75, 1.0)
    bothlock_color = rgba(255, 91, 105, 1.0)

    invert_numlock = false
    swap_font_color = false

    position = 0, -20
    halign = center
    valign = center
}

# ============================================================
# STATUS FOOTER
# ============================================================

label {
    monitor =
    text = SECURE CHANNEL ACTIVE // ENCRYPTED SESSION

    color = rgba(91, 218, 235, 0.72)

    font_size = 11
    font_family = monospace

    position = 0, -98
    halign = center
    valign = center
}

label {
    monitor =
    text = PUBLIC SECURITY SECTION 9

    color = rgba(130, 154, 162, 0.60)

    font_size = 10
    font_family = monospace

    position = 0, 28
    halign = center
    valign = bottom
}
