# ============================================================
# SECTION 9 // TERMINAL INTERFACE
# ============================================================

# Core colors
foreground              #c8d9e2
background              #050b12

background_opacity      0.96
background_blur         0

dim_opacity             0.65

# Cursor
cursor                  #5bdaeb
cursor_text_color       #050b12
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.6
cursor_stop_blinking_after 0

# Selection and links
selection_foreground    #e8f7fa
selection_background    #153743

url_color               #5bdaeb
url_style               straight

# Window geometry
window_padding_width    12
window_margin_width     0
window_border_width     1px
draw_minimal_borders    yes
hide_window_decorations yes

active_border_color     #5bdaeb
inactive_border_color   #1c3540
bell_border_color       #ff5b69
inactive_text_alpha     0.75

# Section 9 tab bar
tab_bar_edge             top
tab_bar_style            separator
tab_bar_align            left
tab_bar_min_tabs         2
tab_separator            " │ "

tab_bar_background       #071018
tab_bar_margin_color     #071018

active_tab_foreground    #050b12
active_tab_background    #5bdaeb
active_tab_font_style    bold

inactive_tab_foreground  #78909c
inactive_tab_background  #0b1822
inactive_tab_font_style  normal

tab_title_template       " S9:{index} // {title} "
active_tab_title_template " S9:{index} // {title} "

# Bell
enable_audio_bell       no
visual_bell_duration    0.08
visual_bell_color       #ff5b69

# ANSI palette
color0   #071018
color8   #4b6470

color1   #ff5b69
color9   #ff7b86

color2   #50e6aa
color10  #7df3c0

color3   #f2b84b
color11  #ffd06a

color4   #4f8cff
color12  #72a7ff

color5   #a579d9
color13  #c49cff

color6   #5bdaeb
color14  #8af0fa

color7   #c8d9e2
color15  #f3fbff

# Scrollbar and progress
